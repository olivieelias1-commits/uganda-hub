<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda Business Hub</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f13;color:#fff;font-family:Arial;padding:14px;padding-bottom:100px}.top h1{font-size:22px;font-weight:900}.top p{font-size:12px;color:#8a8aa0}.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:#1c1c25;border:1px solid #2b2b38;border-radius:16px;padding:14px}.label{font-size:11px;color:#8a8aa0}.val{font-size:20px;font-weight:900;margin-top:6px}.green{color:#00ff88}.goal{background:linear-gradient(135deg,#1e1e38,#2a2250);border:1px solid #3a3a5a;border-radius:16px;padding:14px;margin-bottom:14px}.progress{height:8px;background:#2a2a3f;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6);width:0%}.card{background:#1c1c25;border:1px solid #2b2b38;border-radius:16px;padding:14px;margin-bottom:14px}.prospect{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #2b2b38}.pname{font-size:13px;font-weight:700}.pdesc{font-size:11px;color:#8a8aa0}.p-right{display:flex;gap:6px}.badge{padding:6px 10px;border-radius:20px;font-size:10px;font-weight:800;border:none}.new{background:#2a2a35;color:#aaa}.paid{background:#00ff88;color:#000}.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff;border:none;padding:16px 28px;border-radius:30px;font-weight:800}</style></head><body><div class="top"><h1>🇺🇬 Uganda Business Hub</h1><p>All Districts • Kampala • Mbarara • Gulu • Jinja • Masaka • Arua</p></div><div class="grid4"><div class="stat"><div class="label">Businesses</div><div class="val" id="cLeads">0</div></div><div class="stat"><div class="label">Potential</div><div class="val" id="cPipe">0 UGX</div></div><div class="stat"><div class="label">Closed</div><div class="val" id="cDeals">0</div></div><div class="stat"><div class="label">Revenue</div><div class="val green" id="cEarn">0 UGX</div></div></div><div class="goal"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px"><span>🎯 Target: 1M UGX</span><span id="pct">0%</span></div><div class="progress"><div class="fill" id="fill"></div></div><div style="font-size:11px;color:#8a8aa0;margin-top:8px" id="goalText">0 / 1M - All Uganda!</div></div><div class="card"><b>Client List</b><div id="list" style="margin-top:10px"></div></div><button class="fab" onclick="addLead()">+ Add Business</button><script>let goal=1e6,leads=[],total=0;function render(){let h='';leads.forEach(l=>{let i=leads.indexOf(l);h+=`<div class=prospect><div><div class=pname>${l.name}</div><div class=pdesc>${l.desc} - ${l.status}</div></div><div class=p-right><button class='badge ${l.status=='PAID'?'paid':'new'}' onclick='togglePaid(${i})'>${l.status}</button><button onclick='removeLead(${i})' style='width:32px;height:32px;border-radius:50%;background:#2a2a35;color:#aaa;border:none'>✕</button></div></div>`});document.getElementById('list').innerHTML=h||'<div style=color:#8a8aa0;font-size:12px>No businesses yet.</div>';document.getElementById('cLeads').innerText=leads.length;document.getElementById('cDeals').innerText=leads.filter(l=>l.status=='PAID').length;document.getElementById('cEarn').innerText=total.toLocaleString()+' UGX';document.getElementById('cPipe').innerText=(leads.length*150000).toLocaleString()+' UGX';let pct=Math.min(100,Math.round(total/goal*100));document.getElementById('fill').style.width=pct+'%';document.getElementById('pct').innerText=pct+'%';document.getElementById('goalText').innerText=total.toLocaleString()+' / 1,000,000 - '+(pct>=100?'TARGET HIT!':'All Uganda Hustle!')}function togglePaid(i){if(leads[i].status!='PAID'){leads[i].status='PAID';total+=150000}else{leads[i].status='NEW';total-=150000;if(total<0)total=0}render()}function removeLead(i){if(confirm('Remove?')){if(leads[i].status=='PAID')total-=150000;leads.splice(i,1);render()}}function addLead(){let n=prompt('Business name?');if(!n)return;let d=prompt('District?','Kampala');leads.push({name:n,desc:d||'Uganda',status:'NEW'});render()}render()</script></body></html>
