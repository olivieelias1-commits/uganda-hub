<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World AI Store - 10 Products Never End</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white">
<div class="max-w-4xl mx-auto p-4">
<h1 class="text-3xl font-black text-center py-6">🌍 WORLD AI STORE<br><span class="text-yellow-400 text-sm">10 Digital Products - Never Ends - All Languages</span></h1>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="store"></div>
<div class="text-center py-8">
<p class="text-zinc-500 text-xs">AI Sells 24/7 Worldwide • Instant Delivery</p>
<p class="text-yellow-400 font-bold mt-2">olivieelias1-commits.github.io/uganda-hub</p>
</div>
</div>
<script>
const products=[
{name:"100 Pro Logos Pack",price:10,emoji:"🎨",desc:"Never ends - sell forever"},
{name:"Instagram Viral Bio",price:5,emoji:"📱",desc:"All languages"},
{name:"Pro CV Resume",price:7,emoji:"📄",desc:"Get jobs worldwide"},
{name:"Afrobeat Hits Pack",price:15,emoji:"🎵",desc:"10 beats - unlimited sales"},
{name:"WhatsApp Sales Scripts",price:9,emoji:"💬",desc:"AI sells for you"},
{name:"Side Hustle Ebook",price:12,emoji:"📚",desc:"100 ideas never end"},
{name:"Poster Design Bundle",price:8,emoji:"🖼️",desc:"50 posters instant"},
{name:"Email Pitch Templates",price:6,emoji:"✉️",desc:"Close any client"},
{name:"TikTok Viral Hooks",price:5,emoji:"🎬",desc:"Go viral daily"},
{name:"World Business Ideas",price:10,emoji:"🚀",desc:"Global ideas 2026"}];
let h="";
products.forEach(p=>{
h+=`<div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-700"><div class="flex justify-between"><span class="text-3xl">${p.emoji}</span><span class="bg-yellow-400 text-black font-black px-3 py-1 rounded-full text-sm">$${p.price}</span></div><h3 class="font-black mt-3">${p.name}</h3><p class="text-xs text-zinc-400">${p.desc}</p><button onclick="sell('${p.name}',${p.price})" class="w-full mt-4 bg-white text-black font-black py-3 rounded-xl">🤖 AI SELL WORLDWIDE</button></div>`;
});
document.getElementById('store').innerHTML=h;
function sell(name,price){
let msg=`🌍 WORLD STORE - ${name} - $${price}%0A%0A🔥 Digital product - Never ends - Instant delivery!%0A✅ All languages%0A✅ Worldwide%0A%0ABuy now: https://olivieelias1-commits.github.io/uganda-hub/%0A%0AAI Sells 24/7!`;
window.open('https://wa.me/?text='+msg,'_blank');
}
</script></body></html>
