<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD HUB - Digital Products AI Sales</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.h{background:linear-gradient(90deg,#6a00ff,#ff006a);padding:15px;text-align:center}
.rule{margin:10px;background:#fff;color:#000;padding:10px;border-radius:10px;text-align:center;font-weight:bold;font-size:12px}
.create{background:#fff;color:#000;margin:10px;padding:15px;border-radius:12px}
.create input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:10px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;text-align:center}
.ai{margin:10px;background:#111;border:1px solid #333;padding:10px;border-radius:10px;font-size:12px}
.log{background:#000;color:#0f0;font-family:monospace;font-size:11px;height:120px;overflow:auto;padding:8px;border-radius:8px}
</style>
</head>
<body>
<div class="h"><h2>🌍 WORLD HUB</h2><small>AI Sells Your PDF / Design / Project</small></div>
<div class="rule">YOU Upload PDF/Design → AI Finds Buyer → Buyer Pays AI → AI Lets Him GRAB File</div>

<div class="ai"><b>🤖 AI SCRIPT</b> - Searching people who love digital products <div class="log" id="log">> AI Ready to sell PDFs & Designs...<br></div></div>

<div class="create">
<h4>📤 YOU UPLOAD DIGITAL PRODUCT</h4>
<input id="name" placeholder="Product Name: e.g. My Logo Design Pack">
<input id="price" placeholder="Price UGX: e.g. 20000">
<input id="file" type="file" accept=".pdf,.zip,.png,.jpg">
<small>Select your PDF / Design / Zip</small>
<button class="btn" onclick="upload()">🚀 GIVE FILE TO AI TO SELL</button>
</div>

<div class="grid" id="grid"></div>

<script>
let files={};
function log(t){let l=document.getElementById('log');l.innerHTML+=`> ${t}<br>`;l.scrollTop=9999;}
function upload(){
let name=document.getElementById('name').value,price=document.getElementById('price').value,file=document.getElementById('file').files[0];
if(!name||!price||!file)return alert('Enter name, price, and choose file');
let id=Date.now();
let reader=new FileReader();
reader.onload=function(e){
files[id]=e.target.result;
document.getElementById('grid').innerHTML+=`<div class="card" id="c${id}">
<div style="font-size:30px">📄</div><b>${name}</b><br><small>${file.name}</small><br>
<span style="color:#ff6">${price} UGX</span><br>
<div style="margin:8px 0;font-size:11px;color:#aaa">🔒 Locked - Pay to Grab</div>
<button style="width:100%;padding:10px;background:#fff;color:#000;border:none;border-radius:20px;font-weight:bold" onclick="payAndGrab(${id},'${name}','${price}')">❤️ Love it? Pay AI & GRAB PDF</button>
<div id="d${id}"></div>
</div>`;
log(`AI received digital file: ${name} (${file.name})`);
log(`AI searching customers who LOVE ${name}...`);
setTimeout(()=>log(`AI found 89 people who LOVE this design!`),2000);
};
reader.readAsDataURL(file);
}

function payAndGrab(id,name,price){
log(`Customer LOVES ${name} - Paying AI ${price} UGX...`);
document.getElementById(`c${id}`).innerHTML+=`<div style="color:#0f0;margin-top:8px;font-size:12px">Processing payment via AI...</div>`;
setTimeout(()=>{
log(`✅ Payment for ${name} confirmed by AI!`);
log(`📥 AI unlocking file for customer...`);
let link=`<a href="${files[id]}" download="${name}" style="display:block;margin-top:10px;padding:10px;background:#0f0;color:#000;border-radius:20px;text-decoration:none;font-weight:bold">📥 GRAB / DOWNLOAD NOW</a>`;
document.getElementById(`d${id}`).innerHTML=link+`<div style="color:#0f0;font-size:11px;margin-top:5px">✅ Paid - File unlocked by AI!</div>`;
alert(`🔥 Customer paid ${price}! AI unlocked file: ${name}`);
},2000);
}
</script>
</body>
</html>
